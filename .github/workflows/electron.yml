name: electron

# Desktop (Electron) distribution. Packages the GUI with its native addon
# from the artifacts the per-platform build workflows already produced for
# one commit, smoke-tests every package on a runner of its own OS, and
# attaches the archives to the GitHub release of a v* tag. Nothing here
# rebuilds LKL, QEMU or the wasm bundle.
#
# Inputs, downloaded by run id from the same commit's main-branch runs:
#   wasm.yml     anyfs-web-dist            renderer + hashed wasm fallback
#   linux.yml    anyfs-native-linux-x64    anyfs_native.node, drivelist.node
#   mingw64.yml  anyfs-native-win32-x64    the same + their DLL closure
#   macos.yml    anyfs-native-darwin-<a>   anyfs_native.node, liblkl-kernel.dylib
#                drivelist-darwin-<a>      drivelist.node (built on a Mac)
# drivelist's JavaScript comes from the pinned fork (fetch-drivelist.sh).
#
# Chain:     resolve → fixture + package (matrix, on Linux) → smoke (matrix,
#            on a runner of each OS; macOS packages are ad-hoc signed there)
#            → release
# Artifacts: anyfs-electron-<version>-<os>-<arch>  (archive + .sha256)
#            <version> is sha-<short sha>, or the tag without its "v"
#
# Triggers:
#   workflow_run       linux, mingw64, wasm or macos finished on main. Each
#                      commit triggers this four times; only the run that
#                      finds all four finished goes past `resolve`, and it
#                      fails if one of them failed (a cancelled run, as
#                      wasm.yml's superseded ones, only gives a notice).
#                      The default branch's electron.yml runs for every
#                      commit's runs; a commit with a different electron.yml
#                      (an older one) is skipped with a notice.
#   push (v* tag)      packages the tagged commit and publishes a release.
#                      The commit must have been the head of a push to main,
#                      so the build runs exist; re-run when they finish.
#   workflow_dispatch  packages a main commit again (no release).

on:
  workflow_run:
    workflows: [linux, mingw64, wasm, macos]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to package (default: the head of the selected ref)'
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: electron-${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    # Only pushes to this repository: a fork PR from a branch named main
    # also reports head_branch main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.find.outputs.ready }}
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
      release: ${{ steps.find.outputs.release }}
      linux_run: ${{ steps.find.outputs.linux_run }}
      mingw64_run: ${{ steps.find.outputs.mingw64_run }}
      wasm_run: ${{ steps.find.outputs.wasm_run }}
      macos_run: ${{ steps.find.outputs.macos_run }}
    steps:
      - name: Find the build runs of the commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha="$(gh api "repos/$REPO/commits/$SHA" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          # workflow_run always runs the default branch's electron.yml, also
          # for the runs of an older commit. That commit may lack scripts or
          # workflows this version uses: package only commits whose
          # electron.yml is the one running now, and skip others with a
          # notice. Their builds were checked when they ran.
          blob() { gh api "repos/$REPO/contents/.github/workflows/electron.yml?ref=$1" --jq .sha 2>/dev/null || true; }
          if [[ "$(blob "$sha")" != "$(blob "$WORKFLOW_SHA")" ]]; then
            echo "::notice::$sha has a different electron.yml than this run ($WORKFLOW_SHA); not packaging it"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pending=() failed=() cancelled=()
          for wf in linux mingw64 wasm macos; do
            runs="$(gh api "repos/$REPO/actions/workflows/$wf.yml/runs?head_sha=$sha&event=push&branch=main&per_page=20" \
                      --jq '.workflow_runs | sort_by(.created_at) | reverse')"
            ok="$(jq -r '[.[] | select(.conclusion == "success")][0].id // empty' <<<"$runs")"
            if [[ -n "$ok" ]]; then
              echo "$wf: run $ok succeeded"
              echo "${wf}_run=$ok" >> "$GITHUB_OUTPUT"
            elif [[ -n "$(jq -r '[.[] | select(.status != "completed")][0].id // empty' <<<"$runs")" ]]; then
              echo "$wf: still running"
              pending+=("$wf")
            elif [[ "$(jq -r '.[0].conclusion // empty' <<<"$runs")" == cancelled ]]; then
              # wasm.yml cancels a commit's run when a newer push arrives.
              echo "$wf: run $(jq -r '.[0].id' <<<"$runs") cancelled"
              cancelled+=("$wf")
            else
              echo "$wf: $(jq -r '.[0] | "run \(.id) \(.conclusion)" // "no run"' <<<"$runs")"
              failed+=("$wf")
            fi
          done

          if [[ ${#pending[@]} -eq 0 && ${#failed[@]} -eq 0 && ${#cancelled[@]} -gt 0 ]]; then
            echo "::notice::no desktop packages for $sha: ${cancelled[*]} cancelled (superseded by a newer push?)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ ${#pending[@]} -eq 0 && ${#failed[@]} -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == workflow_run && ${#pending[@]} -gt 0 ]]; then
            # A later completion of ${pending[*]} triggers the run that packages.
            echo "waiting for: ${pending[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no desktop packages for $sha: failed or missing: ${failed[*]:-none}; still running: ${pending[*]:-none}"
            exit 1
          fi

  fixture:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Build smoke fixtures (image file; virtual block device)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils e2fsprogs dosfstools fdisk
          bash ts/examples/electron-demo/scripts/make-smoke-fixture.sh "$RUNNER_TEMP/fixture"
          bash ts/examples/electron-demo/scripts/make-device-fixture.sh "$RUNNER_TEMP/device-fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-fixture
          path: ${{ runner.temp }}/fixture/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: electron-device-fixture
          path: ${{ runner.temp }}/device-fixture/
          if-no-files-found: error
          retention-days: 3

  package:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: linux
            arch: x64
            native: anyfs-native-linux-x64
            native_run: linux_run
          - platform: win32
            os: windows
            arch: x64
            native: anyfs-native-win32-x64
            native_run: mingw64_run
          - platform: darwin
            os: macos
            arch: arm64
            native: anyfs-native-darwin-arm64
            native_run: macos_run
          - platform: darwin
            os: macos
            arch: x64
            native: anyfs-native-darwin-x64
            native_run: macos_run
    env:
      NAME: anyfs-electron-${{ needs.resolve.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: ts/package.json
      # Pinned: node 24.16.0 breaks electron-packager's zip extraction
      # (yauzl event loop drains → silent exit 0 on CI / hang locally,
      # out/ never written; runs 27338704662..27391081970). 24.15.0 is
      # verified good. Re-test before unpinning.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ matrix.platform }}-${{ hashFiles('ts/pnpm-lock.yaml') }}
      # drivelist is a file: dependency on ../drivelist-anyfs; build:main
      # bundles its JavaScript (verify-package.sh fails if it did not). The
      # @anyfs/native filter keeps node-gyp from running for the addon,
      # whose .node comes from the artifact.
      - name: Fetch drivelist
        run: bash ts/examples/electron-demo/scripts/fetch-drivelist.sh
      - name: Install
        working-directory: ts
        run: pnpm install --frozen-lockfile --filter '!@anyfs/native'
      - name: Install LLVM (Mach-O gate of stage-native-macos.sh)
        if: matrix.platform == 'darwin'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-20
      - name: Download renderer (wasm run ${{ needs.resolve.outputs.wasm_run }})
        uses: actions/download-artifact@v4
        with:
          name: anyfs-web-dist
          path: ${{ runner.temp }}/web
          run-id: ${{ needs.resolve.outputs.wasm_run }}
          github-token: ${{ github.token }}
      - name: Download native addon
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native }}
          path: ${{ runner.temp }}/native
          run-id: ${{ needs.resolve.outputs[matrix.native_run] }}
          github-token: ${{ github.token }}
      - name: Download drivelist (macOS)
        if: matrix.platform == 'darwin'
        uses: actions/download-artifact@v4
        with:
          name: drivelist-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/native
          run-id: ${{ needs.resolve.outputs.macos_run }}
          github-token: ${{ github.token }}
      - name: Build main process and stage renderer
        working-directory: ts/examples/electron-demo
        run: |
          mkdir -p ../vite-demo/dist
          tar -xzf "$RUNNER_TEMP/web/anyfs-web-dist.tar.gz" -C ../vite-demo/dist
          pnpm build:main
          pnpm stage:renderer
      # DEBUG tracing stays on: electron-packager has exited 0 without
      # writing out/ on CI (runs 27338704662, 27345017292); the
      # @electron/get trace is the evidence when it recurs. package.sh
      # fails loudly if the output is missing.
      - name: Package ${{ env.NAME }}
        working-directory: ts/examples/electron-demo
        env:
          DEBUG: 'electron-packager,@electron/get:*'
        run: |
          bash scripts/package.sh --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} \
            --native-dir="$RUNNER_TEMP/native" \
            --version=${{ needs.resolve.outputs.version }} \
            --commit=${{ needs.resolve.outputs.sha }} \
            --out="$RUNNER_TEMP/out"
      # macOS: an unsigned intermediate; the smoke job signs it on a Mac and
      # uploads the release zip under ${{ env.NAME }}.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform == 'darwin' && format('unsigned-{0}', env.NAME) || env.NAME }}
          path: |
            ${{ runner.temp }}/out/${{ env.NAME }}.*
          if-no-files-found: error
          retention-days: ${{ matrix.platform == 'darwin' && 3 || 14 }}

  smoke:
    needs: [resolve, fixture, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: linux
            arch: x64
            runner: ubuntu-26.04
            ext: tar.gz
            cli: anyfs-reader-linux-amd64
            cli_run: linux_run
          - platform: win32
            os: windows
            arch: x64
            runner: windows-2025
            ext: zip
            cli: anyfs-reader-win64
            cli_run: mingw64_run
          - platform: darwin
            os: macos
            arch: arm64
            runner: macos-15
            ext: zip
            cli: anyfs-reader-macos-arm64
            cli_run: macos_run
          - platform: darwin
            os: macos
            arch: x64
            runner: macos-15-intel
            ext: zip
            cli: anyfs-reader-macos-x86_64
            cli_run: macos_run
    defaults:
      run:
        shell: bash
    env:
      NAME: anyfs-electron-${{ needs.resolve.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform == 'darwin' && format('unsigned-{0}', env.NAME) || env.NAME }}
          path: ${{ runner.temp }}/pkg
      - uses: actions/download-artifact@v4
        with:
          name: electron-smoke-fixture
          path: ${{ runner.temp }}/fixture
      # Ad hoc (no certificate): the app runs, Gatekeeper still treats a
      # downloaded copy as unidentified (docs/distribution.md).
      - name: Sign and archive (macOS)
        if: matrix.platform == 'darwin'
        run: |
          bash ts/examples/electron-demo/scripts/sign-macos.sh \
            "$RUNNER_TEMP/pkg/$NAME.unsigned.tar.gz" "$RUNNER_TEMP/pkg"
          rm -rf "$RUNNER_TEMP/pkg/$NAME" "$RUNNER_TEMP/pkg/$NAME".unsigned.tar.gz*
      - name: Upload signed package (macOS)
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ runner.temp }}/pkg/${{ env.NAME }}.zip
            ${{ runner.temp }}/pkg/${{ env.NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
      # The smoke tests run on what a user downloads: the archive, unpacked.
      - name: Verify checksum and unpack
        working-directory: ${{ runner.temp }}/pkg
        run: |
          case "${{ matrix.platform }}" in
          darwin)
            shasum -a 256 -c "$NAME.zip.sha256"
            ditto -x -k "$NAME.zip" .
            codesign --verify --deep --strict "$NAME/anyfs-demo.app"
            ;;
          win32)
            sha256sum -c "$NAME.zip.sha256"
            7z x -y -bd "$NAME.zip" >/dev/null
            ;;
          linux)
            sha256sum -c "$NAME.tar.gz.sha256"
            tar -xzf "$NAME.tar.gz"
            ;;
          esac
          ls "$NAME"
      - name: Install Electron runtime libraries (linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 qemu-utils
      # Headless: load the staged addon, open the qcow2 fixture (QEMU block
      # layer), list partitions, mount fixroot, hash payload.bin, halt, exit 0;
      # then list the runner's disks through the staged drivelist addon.
      - name: Native and drives smoke (packaged app)
        run: |
          run=()
          [[ "${{ matrix.platform }}" == linux ]] && run=(xvfb-run -a)
          "${run[@]}" bash ts/examples/electron-demo/scripts/smoke-package.sh \
            "$RUNNER_TEMP/pkg/$NAME" ${{ matrix.platform }} "$RUNNER_TEMP/fixture" \
            "$RUNNER_TEMP/smoke-report.json"
      # The GUI path: the packaged renderer must come up on the native
      # backend, show the fixture's partitions with fstypes and labels, and
      # list the mounted partition's files.
      - name: GUI smoke (packaged app, Playwright)
        working-directory: ts/tests/e2e
        env:
          ANYFS_PACKAGED_FIXTURE: ${{ runner.temp }}/fixture
          ANYFS_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          (cd ../.. && pnpm install --frozen-lockfile --filter @anyfs/e2e)
          mkdir -p "$ANYFS_SCREENSHOT_DIR"
          case "${{ matrix.platform }}" in
          win32)
            export ANYFS_PACKAGED_EXE="$RUNNER_TEMP/pkg/$NAME/anyfs-demo.exe"
            npx playwright test -c packaged.config.ts
            ;;
          darwin)
            export ANYFS_PACKAGED_EXE="$RUNNER_TEMP/pkg/$NAME/anyfs-demo.app/Contents/MacOS/anyfs-demo"
            npx playwright test -c packaged.config.ts
            ;;
          linux)
            export ANYFS_PACKAGED_EXE="$RUNNER_TEMP/pkg/$NAME/anyfs-demo"
            xvfb-run -a npx playwright test -c packaged.config.ts
            ;;
          esac
      # ── Virtual block device I/O ──────────────────────────────────────────
      # Once the device is attached, each check runs even if an earlier one
      # failed (the job still fails), so one failure does not hide the rest.
      # make-device-fixture.sh's parts.img attached READ-ONLY as a block
      # device this job creates: Linux loop (plus an nbd export of the same
      # file for the GUI, because drivelist hides loop devices), macOS
      # hdiutil -readonly -nomount, Windows Mount-DiskImage -Access ReadOnly
      # of parts.vhdx. Never one of the runner's own disks. test-device.{sh,ps1}
      # take the device from the attach command's answer, verify it against
      # parts.img, and on detach check the backing file did not change.
      - uses: actions/download-artifact@v4
        with:
          name: electron-device-fixture
          path: ${{ runner.temp }}/device-fixture
      # The CLI distribution of the same commit (linux.yml, mingw64.yml,
      # macos.yml), for tests/device/run-cli-device-tests.sh.
      - name: Download CLI tools (${{ matrix.cli }})
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli }}
          path: ${{ runner.temp }}/cli
          run-id: ${{ needs.resolve.outputs[matrix.cli_run] }}
          github-token: ${{ github.token }}
      - name: Unpack CLI tools and install protocol clients
        run: |
          cd "$RUNNER_TEMP/cli"
          tar -xzf ./*.tar.gz
          lspart="$(find "$RUNNER_TEMP/cli" -type f \( -name anyfs-lspart -o -name anyfs-lspart.exe \) | head -1)"
          [[ -n "$lspart" ]] || { echo "::error::no anyfs-lspart in ${{ matrix.cli }}"; exit 1; }
          echo "ANYFS_CLI_TOOLS=$(dirname "$lspart")" >> "$GITHUB_ENV"
          case "${{ matrix.platform }}" in
          linux) sudo apt-get install -y --no-install-recommends smbclient nfs-common ;;
          win32) python -m pip install --quiet smbprotocol ;;
          esac
          { command -v python3 && python3 --version; } || echo "python3 not on PATH"
      - name: Device I/O - attach (loop / hdiutil)
        id: attach-posix
        if: matrix.platform != 'win32'
        run: bash scripts/ci/test-device.sh attach "$RUNNER_TEMP/device-fixture/parts.img" "$RUNNER_TEMP/dev"
      - name: Device I/O - attach (read-only VHDX)
        id: attach-win
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./scripts/ci/test-device.ps1 attach "$env:RUNNER_TEMP/device-fixture/parts.vhdx" "$env:RUNNER_TEMP/device-fixture/parts.img" "$env:RUNNER_TEMP/dev"
      # Linux/macOS: the device nodes become root-owned 0600. Windows: the
      # app runs with a restricted Basic User token (the runner account is
      # an administrator). Either way the app must fail with a permission
      # error, not hang or crash.
      - name: Device I/O - app without access is denied
        if: ${{ !cancelled() && (steps.attach-posix.outcome == 'success' || steps.attach-win.outcome == 'success') }}
        run: |
          run=()
          [[ "${{ matrix.platform }}" == linux ]] && run=(xvfb-run -a)
          [[ "${{ matrix.platform }}" == win32 ]] || bash scripts/ci/test-device.sh perm deny "$RUNNER_TEMP/dev"
          "${run[@]}" bash ts/examples/electron-demo/scripts/smoke-device.sh "$RUNNER_TEMP/pkg/$NAME" \
            ${{ matrix.platform }} "$RUNNER_TEMP/dev" "$RUNNER_TEMP/device-fixture" deny \
            "$RUNNER_TEMP/device-report-deny.json"
      - name: Device I/O - CLI without access is denied
        if: ${{ !cancelled() && (steps.attach-posix.outcome == 'success' || steps.attach-win.outcome == 'success') }}
        run: |
          cli=(bash tests/device/run-cli-device-tests.sh --tools="$ANYFS_CLI_TOOLS"
               --device-env="$RUNNER_TEMP/dev/device.env" --expect-denied
               --logdir="$RUNNER_TEMP/cli-device-logs/denied")
          if [[ "${{ matrix.platform }}" == win32 ]]; then
            bash scripts/ci/run-restricted-win.sh "$RUNNER_TEMP/cli-device-denied.log" -- "${cli[@]}"
          else
            "${cli[@]}"
          fi
      - name: Device I/O - app reads the device
        if: ${{ !cancelled() && (steps.attach-posix.outcome == 'success' || steps.attach-win.outcome == 'success') }}
        run: |
          run=()
          [[ "${{ matrix.platform }}" == linux ]] && run=(xvfb-run -a)
          [[ "${{ matrix.platform }}" == win32 ]] || bash scripts/ci/test-device.sh perm allow "$RUNNER_TEMP/dev"
          "${run[@]}" bash ts/examples/electron-demo/scripts/smoke-device.sh "$RUNNER_TEMP/pkg/$NAME" \
            ${{ matrix.platform }} "$RUNNER_TEMP/dev" "$RUNNER_TEMP/device-fixture" allow \
            "$RUNNER_TEMP/device-report-allow.json"
          if [[ "${{ matrix.platform }}" == darwin ]]; then
            source "$RUNNER_TEMP/dev/device.env"
            SMOKE_DEVICE="$ANYFS_TEST_RAW_DEVICE" bash ts/examples/electron-demo/scripts/smoke-device.sh \
              "$RUNNER_TEMP/pkg/$NAME" darwin "$RUNNER_TEMP/dev" "$RUNNER_TEMP/device-fixture" allow \
              "$RUNNER_TEMP/device-report-allow-raw.json"
          fi
      - name: Device I/O - CLI reads the device
        if: ${{ !cancelled() && (steps.attach-posix.outcome == 'success' || steps.attach-win.outcome == 'success') }}
        run: |
          bash tests/device/run-cli-device-tests.sh --tools="$ANYFS_CLI_TOOLS" \
            --device-env="$RUNNER_TEMP/dev/device.env" --logdir="$RUNNER_TEMP/cli-device-logs/allowed"
      - name: Device I/O - GUI picks the device (macOS, Windows)
        if: ${{ !cancelled() && matrix.platform != 'linux' && (steps.attach-posix.outcome == 'success' || steps.attach-win.outcome == 'success') }}
        working-directory: ts/tests/e2e
        env:
          ANYFS_DEVICE_JSON: ${{ runner.temp }}/dev/device.json
          ANYFS_DEVICE_FIXTURE: ${{ runner.temp }}/device-fixture
          ANYFS_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          if [[ "${{ matrix.platform }}" == win32 ]]; then
            export ANYFS_PACKAGED_EXE="$RUNNER_TEMP/pkg/$NAME/anyfs-demo.exe"
          else
            export ANYFS_PACKAGED_EXE="$RUNNER_TEMP/pkg/$NAME/anyfs-demo.app/Contents/MacOS/anyfs-demo"
          fi
          npx playwright test -c packaged.config.ts device
      - name: Device I/O - detach (loop / hdiutil)
        if: always() && matrix.platform != 'win32'
        run: bash scripts/ci/test-device.sh detach "$RUNNER_TEMP/dev"
      - name: Device I/O - detach (VHDX)
        if: always() && matrix.platform == 'win32'
        shell: pwsh
        run: ./scripts/ci/test-device.ps1 detach "$env:RUNNER_TEMP/dev"
      - name: Device I/O - GUI picks the device (Linux, nbd)
        if: ${{ !cancelled() && matrix.platform == 'linux' }}
        working-directory: ts/tests/e2e
        env:
          ANYFS_DEVICE_JSON: ${{ runner.temp }}/dev-nbd/device.json
          ANYFS_DEVICE_FIXTURE: ${{ runner.temp }}/device-fixture
          ANYFS_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
          ANYFS_PACKAGED_EXE: ${{ runner.temp }}/pkg/${{ env.NAME }}/anyfs-demo
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/test-device.sh" attach --nbd "$RUNNER_TEMP/device-fixture/parts.img" "$RUNNER_TEMP/dev-nbd"
          bash "$GITHUB_WORKSPACE/scripts/ci/test-device.sh" perm allow "$RUNNER_TEMP/dev-nbd"
          xvfb-run -a npx playwright test -c packaged.config.ts device
      - name: Device I/O - detach (nbd)
        if: always() && matrix.platform == 'linux'
        run: bash scripts/ci/test-device.sh detach "$RUNNER_TEMP/dev-nbd"
      - name: Upload smoke report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/smoke-report*.json
            ${{ runner.temp }}/device-report*.json
            ${{ runner.temp }}/dev*/device.json
            ${{ runner.temp }}/cli-device-logs/
            ${{ runner.temp }}/cli-device-denied.log
            ${{ runner.temp }}/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [resolve, smoke]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anyfs-electron-${{ needs.resolve.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Publish to the ${{ github.ref_name }} release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
          files=(./*.tar.gz ./*.zip SHA256SUMS)
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$REPO" --clobber "${files[@]}"
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" -R "$REPO" --verify-tag --title "anyfs $TAG" "${prerelease[@]}" \
              --notes "Desktop app (Electron) packages for Linux x64, Windows x64 and macOS arm64/x64, built from ${SHA:0:7}. Not code-signed (macOS: ad hoc); see docs/distribution.md for installation and verification." \
              "${files[@]}"
          fi
