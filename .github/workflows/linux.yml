name: linux

# Builds the Linux x86_64 distribution tarball (anyfs-ksmbd + anyfs-nfsd +
# anyfs-lspart + anyfs-fuse + liblkl.so + libanyfs-qemublk.so) and uploads it
# as an artifact.
#
# Toolchain: zig cc at a pinned glibc floor (x86_64-linux-gnu.2.11, baseline
# x86-64) for everything but the LKL kernel half, which stays on the runner's
# gcc with KCFLAGS pinning the ISA. Third-party libraries come from the static
# sysroot built by scripts/build_linux_sysroot.sh, so the runner's distro
# doesn't reach the output; check_linux_abi.sh gates the tarball.
#
# LKL kernel:  deps/linux  (via peru — xdqi/lkl@lkl-anyfs, unified ref for
#               linux-amd64 + mingw64 + wasm; see peru.yaml for pinned SHA)
# QEMU:        deps/qemu   (via peru — v11.0.0 pinned SHA)
# ksmbd-tools: deps/ksmbd-tools (via peru — pinned SHA)
#
# The `net/sunrpc/svc.c` rpcbind guard is applied by gen_lkl_config.sh itself
# (function patch_sunrpc_lkl_guard; idempotent via LKL_RPCBIND_GUARD marker),
# so anyfs-nfsd in the produced artifact does not hang at startup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Ephemeral sccache-dist compile farm. Workers serve the coordinator
  # (the build job) and exit when it goes offline. Skipped on PRs —
  # fork PRs have no TS_OAUTH_SECRET and same-repo PRs don't need the
  # farm for cache-warm builds. Also skipped when TS_OAUTH_SECRET is not
  # configured, so missing-secret runs stay green instead of failing the
  # worker jobs. (The secrets context is not allowed in `if` expressions,
  # so its presence is laundered through job-level env.)
  sccache-workers:
    name: sccache worker ${{ matrix.idx }}
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      matrix:
        idx: [1, 2]
    env:
      FARM_SECRET_SET: ${{ secrets.TS_OAUTH_SECRET != '' }}
    steps:
      - name: Farm disabled — TS_OAUTH_SECRET not configured
        if: ${{ env.FARM_SECRET_SET == 'false' }}
        run: echo "TS_OAUTH_SECRET is not set; skipping farm worker (build compiles locally)."
      - uses: xdqi/sccache-dist-action@v0.0.10
        if: ${{ env.FARM_SECRET_SET == 'true' }}
        with:
          mode: worker
          worker-index: '${{ matrix.idx }}'
          oauth-secret: '${{ secrets.TS_OAUTH_SECRET }}'
          # The OAuth client owns tag:ci (not the action default tag:ci-sccache).
          tags: 'tag:ci'

  build:
    name: linux-amd64
    runs-on: ubuntu-26.04
    timeout-minutes: 75

    env:
      FARM_SECRET_SET: ${{ secrets.TS_OAUTH_SECRET != '' }}

    steps:
      - name: Checkout anyfs-reader
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # No -dev packages for the libraries the artifacts link: those come
          # from the static sysroot, and leaving them out makes a host leak
          # fail loudly. libelf/libssl serve the kernel's host tools.
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config python3 pipx \
            flex bison bc rsync libelf-dev libssl-dev perl xz-utils \
            patchelf ca-certificates \
            smbclient nfs-common curl \
            shellcheck

      # ── Caches ──────────────────────────────────────────────────────────────
      # All source deps (linux, qemu, ksmbd-tools) are now managed by peru and
      # cached together under ./deps/. Key on peru.yaml (SHA-pinned — no lock
      # file; cache rebuilds exactly when any pin moves).
      - name: Cache peru-synced deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('peru.yaml') }}

      # Per-target LKL kernel build output (config + object tree). Key includes
      # the script hashes so it rebuilds when gen/build/patch logic changes.
      - name: Cache LKL per-target build (linux-amd64)
        id: cache-lkl
        uses: actions/cache@v4
        with:
          path: lkl-linux-amd64
          # -zig-: trees from the host-gcc toolchain must not be restored.
          key: lkl-linux-amd64-zig-${{ hashFiles('peru.yaml', 'scripts/gen_lkl_config.sh', 'scripts/build_lkl.sh', 'scripts/lib/lkl-linux-cc.sh', 'scripts/lib/zig-cc.sh', 'scripts/oot_fs.sh', '.github/workflows/linux.yml') }}
          restore-keys: |
            lkl-linux-amd64-zig-

      - name: Cache OOT FS sources (NTFS PLUS + APFS + OpenZFS)
        id: cache-oot
        uses: actions/cache@v4
        with:
          path: ~/oot-fs
          key: oot-fs-${{ hashFiles('scripts/oot_fs.sh') }}
          restore-keys: |
            oot-fs-

      - name: Cache QEMU per-target build (linux-amd64)
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: deps/qemu/build-anyfs-linux-amd64
          key: qemu-linux-amd64-zig-${{ hashFiles('peru.yaml', 'scripts/build_qemu.sh', 'scripts/lib/zig-cc.sh', 'patches/qemu/series.native', 'scripts/build_linux_sysroot.sh', 'scripts/lib/sysroot_sources.sh') }}
          restore-keys: |
            qemu-linux-amd64-zig-

      # ── Fetch pinned dependencies ───────────────────────────────────────────
      - name: Install peru
        run: |
          pipx install peru
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"   # pipx installs here; ensure peru is on PATH for later steps

      # zig builds every linux-amd64 artifact (glibc floor + baseline ISA).
      # A stable install path keeps cached build trees valid across runs.
      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ~/zig-0.16.0
          key: zig-0.16.0-x86_64-linux

      - name: Install zig
        run: ./scripts/fetch_zig.sh

      - name: Cache linux sysroot
        id: cache-sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/anyfs-linux-sysroot
          key: linux-sysroot-${{ hashFiles('scripts/build_linux_sysroot.sh', 'scripts/lib/sysroot_sources.sh', 'scripts/lib/linux_sysroot.manifest', 'scripts/lib/zig-cc.sh', 'patches/sysroot/**', 'build.config.toml') }}

      - name: Build linux sysroot
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: ./scripts/build_linux_sysroot.sh

      - name: Sync pinned dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: peru sync

      # Doctor checks: meson/ninja/peru/python3, native ld >= 2.30, deps synced.
      # NOTE: doctor also checks mingw cross and wasm-ld, which are NOT present
      # in this job (linux-amd64 doesn't need them). We run doctor advisory-only
      # (|| echo) so relevant checks surface in the log without blocking the job
      # on irrelevant ones. The wasm-ld and mingw checks will print FAIL but that
      # is expected and harmless here.
      - name: Preflight (doctor)
        run: ./scripts/doctor.sh || echo "doctor reported issues (advisory — mingw/wasm-ld checks are expected to fail in this job)"

      - name: Lint — no hardcoded paths in migrated build scripts
        run: ./scripts/lint-no-hardcoded-paths.sh

      - name: Lint — shellcheck
        run: ./scripts/lint-shellcheck.sh

      # ── sccache-dist farm (best-effort; build proceeds locally if absent) ──
      # Gated on TS_OAUTH_SECRET: without it the farm cannot come up, so skip
      # the whole block (sccache never lands on PATH and the build uses plain
      # gcc, exactly like the PR path).
      - name: Cache sccache objects
        if: ${{ github.event_name != 'pull_request' && env.FARM_SECRET_SET == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-linux-amd64-${{ github.sha }}
          restore-keys: |
            sccache-linux-amd64-

      - name: Bring up sccache-dist farm
        id: farm
        if: ${{ github.event_name != 'pull_request' && env.FARM_SECRET_SET == 'true' }}
        continue-on-error: true
        uses: xdqi/sccache-dist-action@v0.0.10
        with:
          mode: coordinator
          expected-workers: 2
          min-workers: 1
          wait-timeout: 180s
          oauth-secret: '${{ secrets.TS_OAUTH_SECRET }}'
          # The OAuth client owns tag:ci (not the action default tag:ci-sccache).
          tags: 'tag:ci'

      # Start the sccache daemon now with a warning log: --show-stats only
      # counts compiles that couldn't be distributed, the daemon's warnings
      # say why. Idle timeout off, so a quiet stretch can't let it exit and
      # come back without the log.
      - name: Start sccache with a warning log
        if: ${{ steps.farm.outcome == 'success' }}
        continue-on-error: true
        run: |
          SCCACHE_IDLE_TIMEOUT=0 SCCACHE_LOG=warn \
            SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-daemon.log" sccache --start-server

      # Route zig compiles through sccache when the farm put it on PATH.
      - name: Enable sccache for zig
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "ANYFS_ZIG_SCCACHE=1" >> "$GITHUB_ENV"
          fi

      # Out-of-tree FS sources: NTFS PLUS, APFS, OpenZFS. gen_lkl_config.sh
      # internally runs `oot_fs.sh stage`, which silently no-ops if the
      # source directories don't exist — so without a prior fetch the
      # produced kernel lacks all three drivers.
      - name: Fetch OOT FS sources
        if: steps.cache-oot.outputs.cache-hit != 'true'
        run: |
          ./scripts/oot_fs.sh fetch --update
          ls -la "$HOME/oot-fs" || true

      # ── Build pipeline ──────────────────────────────────────────────────────
      - name: Generate LKL kernel config (applies LKL_RPCBIND_GUARD)
        run: |
          ./scripts/gen_lkl_config.sh \
            --linux=deps/linux \
            --out="$GITHUB_WORKSPACE" \
            --targets=linux-amd64

      - name: Build LKL kernel
        run: |
          SCCACHE_ARGS=()
          if command -v sccache >/dev/null 2>&1; then
            SCCACHE_ARGS=(--sccache)
          fi
          ./scripts/build_lkl.sh \
            --linux=deps/linux \
            --out="$GITHUB_WORKSPACE" \
            --targets=linux-amd64 \
            "${SCCACHE_ARGS[@]}" \
            -j"${SCCACHE_J:-$(nproc)}"

      - name: Build QEMU block layer
        run: |
          ./scripts/build_qemu.sh \
            --qemu-src=deps/qemu \
            --targets=linux-amd64 \
            -j"${SCCACHE_J:-$(nproc)}"

      - name: Build anyfs-reader (core + server + fuse)
        run: |
          ./scripts/build_anyfs.sh \
            --targets=linux-amd64 \
            --components=core,server,fuse \
            --lkl-src=deps/linux \
            --qemu-root=deps/qemu \
            --ksmbd-root=deps/ksmbd-tools \
            -j"$(nproc)"

      - name: sccache stats
        if: ${{ github.event_name != 'pull_request' && env.FARM_SECRET_SET == 'true' }}
        continue-on-error: true
        run: sccache --show-stats || true

      - name: Run C unit tests
        run: meson test -C build-anyfs-linux-amd64 --suite unit --print-errorlogs

      - name: Wasm export drift gate
        run: ./tests/test_wasm_exports.sh

      # ── Integration smoke test ──────────────────────────────────────────────
      # Boots each anyfs binary against a Debian 13 generic-cloud qcow2 and
      # asserts lspart/smbclient/nfs see a real Debian rootfs. This catches
      # regressions in the QEMU block backend, ksmbd-tools wiring, and the
      # host_proxy data path that a pure compile job would miss.
      - name: Cache Debian 13 qcow2
        id: cache-debian
        uses: actions/cache@v4
        with:
          path: /tmp/debian-13-genericcloud-amd64.qcow2
          key: debian-13-genericcloud-amd64-v1

      - name: Download Debian 13 qcow2
        if: steps.cache-debian.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/debian-13-genericcloud-amd64.qcow2 \
            https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          ls -lh /tmp/debian-13-genericcloud-amd64.qcow2

      - name: Run integration smoke test
        run: |
          ./tests/smoke-debian-qcow2.sh \
            --build-dir="$GITHUB_WORKSPACE/build-anyfs-linux-amd64" \
            --nfs-mount \
            /tmp/debian-13-genericcloud-amd64.qcow2

      # package_linux.sh runs check_linux_abi.sh 2.11 on every ELF it packs.
      - name: Package distribution tarball (+ glibc 2.11 ABI gate)
        run: |
          ./scripts/package_linux.sh build-anyfs-linux-amd64
          ls -la /tmp/anyfs-reader-*-linux-amd64.tar.gz

      # glibc 2.11.3 userland: proves the floor at runtime, not only in the
      # symbol tables. glibc 2.11's time() jumps into the vsyscall page, which
      # kernels built with LEGACY_VSYSCALL_NONE don't map; anyfs-lspart's path
      # doesn't call it (verified on such a kernel), and GitHub's Ubuntu
      # kernels emulate vsyscall anyway.
      - name: Old-userland smoke (debian/eol:squeeze, glibc 2.11)
        run: |
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          tar xzf /tmp/anyfs-reader-*-linux-amd64.tar.gz -C /tmp/pkg
          pkg="$(ls -d /tmp/pkg/anyfs-reader-*)"
          out="$(docker run --rm \
                   -v "$pkg:/anyfs:ro" \
                   -v /tmp/debian-13-genericcloud-amd64.qcow2:/img.qcow2:ro \
                   debian/eol:squeeze \
                   /anyfs/bin/anyfs-lspart /img.qcow2 2>&1)"
          echo "$out"
          echo "$out" | grep -qiE 'disk0/p1[[:space:]].*ext4'
          echo "$out" | grep -qiE 'disk0/p15[[:space:]].*(vfat|fat)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyfs-reader-linux-amd64
          path: /tmp/anyfs-reader-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14

      # ── Electron native addon ───────────────────────────────────────────────
      # anyfs_native.node links the core, LKL, QEMU and sysroot archives built
      # above (zig, glibc 2.25 = Electron's own floor). electron.yml packages
      # the desktop app from this artifact; it never rebuilds the kernel.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Build Electron native addon
        env:
          LINUX_SRC: ${{ github.workspace }}/deps/linux
          QEMU_SRC: ${{ github.workspace }}/deps/qemu
          QEMU_BLD_LINUX: ${{ github.workspace }}/deps/qemu/build-anyfs-linux-amd64
        run: |
          # --ignore-scripts: the gypfile install hook would run a bare
          # node-gyp rebuild with the host compiler.
          (cd ts && pnpm install --frozen-lockfile --filter @anyfs/native --ignore-scripts)
          ELECTRON_TARGET="$(node ts/examples/electron-demo/scripts/electron-version.mjs)"
          export ELECTRON_TARGET
          bash ts/packages/anyfs-native/scripts/build-linux-electron.sh
          bash ts/examples/electron-demo/scripts/collect-native.sh linux \
            "$RUNNER_TEMP/anyfs-native-linux-x64"

      - name: Upload Electron native addon
        uses: actions/upload-artifact@v4
        with:
          name: anyfs-native-linux-x64
          path: ${{ runner.temp }}/anyfs-native-linux-x64/
          if-no-files-found: error
          retention-days: 14

      # The farm's forwarder outlives its setup step, and the runner stops
      # printing its output (and the scheduler's) once that step ends; the
      # action keeps a copy in log-file. Uploaded with the daemon's warnings.
      - name: Upload sccache-dist coordinator log
        if: ${{ always() && steps.farm.outputs.log-file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sccache-dist-coordinator-log-linux-amd64
          path: |
            ${{ steps.farm.outputs.log-file }}
            ${{ runner.temp }}/sccache-daemon.log
          retention-days: 14
